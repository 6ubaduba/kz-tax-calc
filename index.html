<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Расчет сделки (ИП на ОУР с НДС)</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/logo.png"><link rel="icon" href="/logo.png">

    <style>
        :root {
            /* Светлая тема (мягкая, без едкого контраста) */
            --bg: #eef2f6;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --input-bg: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --red: #ef4444;
            --green: #10b981;
            --clean-bg: #ecfdf5;
            --clean-border: #a7f3d0;
            --clean-text: #065f46;
            --tip-bg: #1e293b;
            --tip-text: #f8fafc;
        }

        [data-theme="dark"] {
            /* Ночная тема (глубокий матовый тон) */
            --bg: #0b1120;
            --card-bg: #151e32;
            --border: #26354f;
            --input-bg: #0f172a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --red: #f87171;
            --green: #34d399;
            --clean-bg: #064e3b33;
            --clean-border: #05966955;
            --clean-text: #6ee7b7;
            --tip-bg: #334155;
            --tip-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
        }

        .header h1 {
            font-size: 16px;
            margin: 0;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.25;
        }

        .theme-btn {
            background: var(--input-bg);
            border: 1px solid var(--border);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--text-main);
            outline: none;
        }
        .theme-btn:active {
            transform: scale(0.95);
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .lbl {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tip {
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
        }
        .tip:hover, .tip.act {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }
        .tip .pop {
            display: none;
            position: absolute;
            bottom: 135%;
            left: 50%;
            transform: translateX(-50%);
            width: 230px;
            background: var(--tip-bg);
            color: var(--tip-text);
            font-size: 11.5px;
            padding: 9px 12px;
            border-radius: 10px;
            z-index: 99;
            pointer-events: none;
            line-height: 1.4;
            font-weight: 400;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .tip:hover .pop, .tip.act .pop { display: block; }

        input, select {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-main);
            outline: none;
        }
        input:focus, select:focus {
            border-color: var(--accent);
        }

        .row2 {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
        }

        .btn {
            width: 100%;
            height: 46px;
            background: var(--accent);
            color: #ffffff;
            border: none;
            font-size: 14.5px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 14px;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.99); }

        .res {
            margin-top: 14px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
            display: none;
        }

        .clean-card {
            background: var(--clean-bg);
            border: 1px solid var(--clean-border);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .clean-card span {
            font-size: 13px;
            font-weight: 600;
            color: var(--clean-text);
        }
        .clean-card strong {
            font-size: 17px;
            font-weight: 700;
            color: var(--green);
        }

        .r-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            font-size: 13px;
            color: var(--text-muted);
        }
        .r-row strong {
            color: var(--red);
            font-weight: 600;
        }
        .r-row.tot {
            border-top: 1px dashed var(--border);
            margin-top: 6px;
            padding-top: 8px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Компактный режим после расчета */
        .mini .header { margin-bottom: 8px; padding-bottom: 8px; }
        .mini .logo { width: 30px; height: 30px; border-radius: 8px; }
        .mini .header h1 { font-size: 14px; }
        .mini .theme-btn { width: 30px; height: 30px; font-size: 14px; }
        .mini .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .mini .row2 { grid-column: span 2; gap: 8px; }
        .mini .lbl { font-size: 11px; }
        .mini input, .mini select { height: 34px; font-size: 13px; padding: 0 8px; }
        .mini .btn { height: 38px; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="header">
            <div class="header-left">
                <img src="/logo.png" alt="Лого" class="logo">
                <h1>Расчет сделки (ОУР РК)</h1>
            </div>
            <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">🌙</button>
        </div>

        <div class="grid">
            <div class="field">
                <div class="lbl">Сумма от клиента:
                    <span class="tip" onclick="tTip(event,this)">ⓘ<span class="pop">Полная сумма выставленного счета или оплаты от клиента с НДС.</span></span>
                </div>
                <input type="number" id="rev" placeholder="500000" inputmode="numeric">
            </div>

            <div class="field">
                <div class="lbl">Расход по сделке:
                    <span class="tip" onclick="tTip(event,this)">ⓘ<span class="pop">Оплата поставщику или подрядчику за товары/услуги.</span></span>
                </div>
                <input type="number" id="exp" placeholder="300000" inputmode="numeric">
            </div>

            <div class="row2">
                <div class="field">
                    <div class="lbl">Категория расхода:
                        <span class="tip" onclick="tTip(event,this)">ⓘ<span class="pop"><b>С НДС:</b> зачет НДС + вычет ИПН.<br><b>Без НДС:</b> только вычет ИПН.<br><b>Без док.:</b> без зачетов.</span></span>
                    </div>
                    <select id="cat">
                        <option value="with_vat">В орган / с НДС</option>
                        <option value="without_vat">Без НДС (с актами)</option>
